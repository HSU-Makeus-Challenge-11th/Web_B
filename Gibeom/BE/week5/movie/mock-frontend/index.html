<!-- mock-frontend/index.html -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>UMC Movie API 테스트</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    code { color: #555; font-size: 13px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    input { flex: 1; padding: 6px 8px; }
    button { padding: 6px 12px; cursor: pointer; }
    pre { background: #f6f6f6; padding: 10px; border-radius: 6px; white-space: pre-wrap; margin: 10px 0 0; min-height: 20px; }
    .ok { color: #1a7f37; } .err { color: #cf222e; }
  </style>
</head>
<body>
  <h1>UMC Movie API 테스트</h1>
  <p>서버: <code id="base"></code></p>

  <section>
    <h2>1. 닉네임 중복 확인</h2>
    <code>GET /members/nickname/{nickname}</code>
    <div class="row">
      <input id="nickname" value="noco" />
      <button onclick="call('nickname', '/members/nickname/' + enc('nickname'))">확인</button>
    </div>
    <pre id="nickname-result"></pre>
  </section>

  <section>
    <h2>2. 이메일 중복 확인</h2>
    <code>GET /members/email/{email}</code>
    <div class="row">
      <input id="email" value="noco@umc.com" />
      <button onclick="call('email', '/members/email/' + enc('email'))">확인</button>
    </div>
    <pre id="email-result"></pre>
  </section>

  <section>
    <h2>3. 회원별 평점 목록 조회</h2>
    <code>GET /members/{memberId}/ratings</code>
    <div class="row">
      <input id="memberId" value="1" />
      <button onclick="call('memberId', '/members/' + enc('memberId') + '/ratings')">조회</button>
    </div>
    <pre id="memberId-result"></pre>
  </section>

  <script>
    // Spring이면 8080, NestJS면 3000으로 바꿔서 테스트하세요.
    const BASE_URL = "http://localhost:8080";
    document.getElementById("base").innerText = BASE_URL;

    const enc = (id) => encodeURIComponent(document.getElementById(id).value.trim());

    async function call(key, path) {
      const out = document.getElementById(key + "-result");
      out.className = "";
      out.innerText = "요청 중...";
      try {
        const res = await fetch(BASE_URL + path);
        const data = await res.json();
        out.className = res.ok ? "ok" : "err";
        out.innerText = `${res.status} ${res.statusText}\n` + JSON.stringify(data, null, 2);
      } catch (e) {
        out.className = "err";
        out.innerText = "요청 실패 (서버 실행 여부나 CORS 설정을 확인하세요)\n" + e;
      }
    }
  </script>
</body>
</html>
