spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:umc-book-rental;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data-demo.sql

server:
  error:
    include-message: always
